# Builds the site and publishes it to GitHub Pages on every push.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/peaceful-turing-rkg2eu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Where the site lives, as set in the repo's Settings -> Pages: the custom
      # domain (https://callumtham.com, at the root) once it's set there, or
      # https://<user>.github.io/PortfolioWebsite/ until then. The build follows
      # whichever it is: links get the /PortfolioWebsite/ prefix only when it's
      # needed, and the full addresses (for search engines and link previews)
      # use the right domain. After changing the domain, run this again.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npx @11ty/eleventy --pathprefix="${{ steps.pages.outputs.base_path }}/"
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
